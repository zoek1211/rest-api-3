# application-test.yml
# test 프로필 전용 설정. 테스트 클래스에 @ActiveProfiles("test")를 붙이면
# application.yml을 먼저 읽고, 그 위에 이 파일의 값을 덮어쓴다.
#
# 왜 src/test/resources에 두나: 테스트 전용 설정이라 배포용 jar(src/main)에 섞일 이유가 없다.
#
# 왜 메모리 DB인가:
#   - 테스트마다 깨끗한 DB에서 시작해야 실행 순서와 상관없이 같은 결과가 나온다 (spec #1 사용자 스토리 37).
#   - 파일을 쓰지 않으니 빠르고, 개발 DB(./db_dev)를 오염시키지 않는다.

spring:
  datasource:
    # jdbc:h2:mem:db_test → 프로세스 메모리 안에 db_test라는 DB를 만든다. JVM이 끝나면 사라진다.
    # DB_CLOSE_DELAY=-1 → 마지막 연결이 닫혀도 JVM이 살아 있는 동안 DB를 유지한다.
    # 주의: 이 옵션이 없으면 연결 풀이 잠깐 연결을 다 닫는 순간 DB가 지워져 "Table not found"가 날 수 있다.
    url: jdbc:h2:mem:db_test;MODE=MySQL;DB_CLOSE_DELAY=-1

  jpa:
    hibernate:
      # 테스트 시작마다 테이블을 새로 만들고, 끝나면 지운다.
      ddl-auto: create-drop
